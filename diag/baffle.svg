<svg class="diagram" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How a baffle filter works, four steps"><rect width="640" height="440" fill="#ffffff"/><text x="320" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1F4E79" text-anchor="middle">HOW A BAFFLE FILTER WORKS</text><text x="320" y="48" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" fill="#8a97a6" text-anchor="middle">A change of direction plus gravity captures the grease</text><rect x="330" y="96" width="150" height="196" rx="6" fill="#eaf1f8" stroke="#1F4E79" stroke-width="3"/><rect x="330" y="96" width="150" height="16" fill="#d7e0ea" stroke="#1F4E79" stroke-width="1.5"/><circle cx="342" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="358" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="374" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="390" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="406" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="422" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="438" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="454" cy="104" r="2.6" fill="#5a3a0e"/><circle cx="470" cy="104" r="2.6" fill="#5a3a0e"/><line x1="342.5" y1="124" x2="342.5" y2="276" stroke="#1F4E79" stroke-width="6" stroke-linecap="round" opacity="0.85"/><line x1="367.5" y1="124" x2="367.5" y2="276" stroke="#1F4E79" stroke-width="6" stroke-linecap="round" opacity="0.85"/><line x1="392.5" y1="124" x2="392.5" y2="276" stroke="#1F4E79" stroke-width="6" stroke-linecap="round" opacity="0.85"/><line x1="417.5" y1="124" x2="417.5" y2="276" stroke="#1F4E79" stroke-width="6" stroke-linecap="round" opacity="0.85"/><line x1="442.5" y1="124" x2="442.5" y2="276" stroke="#1F4E79" stroke-width="6" stroke-linecap="round" opacity="0.85"/><line x1="467.5" y1="124" x2="467.5" y2="276" stroke="#1F4E79" stroke-width="6" stroke-linecap="round" opacity="0.85"/><circle cx="342.5" cy="166" r="3.4" fill="#c8841e"/><circle cx="342.5" cy="216" r="3.4" fill="#c8841e"/><circle cx="342.5" cy="256" r="3.4" fill="#c8841e"/><circle cx="367.5" cy="166" r="3.4" fill="#c8841e"/><circle cx="367.5" cy="216" r="3.4" fill="#c8841e"/><circle cx="367.5" cy="256" r="3.4" fill="#c8841e"/><circle cx="392.5" cy="166" r="3.4" fill="#c8841e"/><circle cx="392.5" cy="216" r="3.4" fill="#c8841e"/><circle cx="392.5" cy="256" r="3.4" fill="#c8841e"/><circle cx="417.5" cy="166" r="3.4" fill="#c8841e"/><circle cx="417.5" cy="216" r="3.4" fill="#c8841e"/><circle cx="417.5" cy="256" r="3.4" fill="#c8841e"/><circle cx="442.5" cy="166" r="3.4" fill="#c8841e"/><circle cx="442.5" cy="216" r="3.4" fill="#c8841e"/><circle cx="442.5" cy="256" r="3.4" fill="#c8841e"/><circle cx="467.5" cy="166" r="3.4" fill="#c8841e"/><circle cx="467.5" cy="216" r="3.4" fill="#c8841e"/><circle cx="467.5" cy="256" r="3.4" fill="#c8841e"/><line x1="358.0" y1="336.0" x2="358.0" y2="310.0" stroke="#c62828" stroke-width="5" stroke-linecap="round"/><polygon points="358.0,298.0 363.8,308.5 352.2,308.5" fill="#c62828"/><line x1="390.0" y1="336.0" x2="390.0" y2="310.0" stroke="#c62828" stroke-width="5" stroke-linecap="round"/><polygon points="390.0,298.0 395.8,308.5 384.2,308.5" fill="#c62828"/><line x1="422.0" y1="336.0" x2="422.0" y2="310.0" stroke="#c62828" stroke-width="5" stroke-linecap="round"/><polygon points="422.0,298.0 427.8,308.5 416.2,308.5" fill="#c62828"/><line x1="454.0" y1="336.0" x2="454.0" y2="310.0" stroke="#c62828" stroke-width="5" stroke-linecap="round"/><polygon points="454.0,298.0 459.8,308.5 448.2,308.5" fill="#c62828"/><text x="405" y="354" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#c62828" text-anchor="middle">GREASE-LADEN AIR IN</text><line x1="358.0" y1="90.0" x2="358.0" y2="68.0" stroke="#1c6cb0" stroke-width="5" stroke-linecap="round"/><polygon points="358.0,56.0 363.8,66.5 352.2,66.5" fill="#1c6cb0"/><line x1="390.0" y1="90.0" x2="390.0" y2="68.0" stroke="#1c6cb0" stroke-width="5" stroke-linecap="round"/><polygon points="390.0,56.0 395.8,66.5 384.2,66.5" fill="#1c6cb0"/><line x1="422.0" y1="90.0" x2="422.0" y2="68.0" stroke="#1c6cb0" stroke-width="5" stroke-linecap="round"/><polygon points="422.0,56.0 427.8,66.5 416.2,66.5" fill="#1c6cb0"/><line x1="454.0" y1="90.0" x2="454.0" y2="68.0" stroke="#1c6cb0" stroke-width="5" stroke-linecap="round"/><polygon points="454.0,56.0 459.8,66.5 448.2,66.5" fill="#1c6cb0"/><rect x="326" y="294" width="158" height="14" rx="3" fill="#c8841e"/><circle cx="342" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 342,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="342" cy="324" r="2.2" fill="#c8841e"/><circle cx="358" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 358,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="358" cy="324" r="2.2" fill="#c8841e"/><circle cx="374" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 374,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="374" cy="324" r="2.2" fill="#c8841e"/><circle cx="390" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 390,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="390" cy="324" r="2.2" fill="#c8841e"/><circle cx="406" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 406,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="406" cy="324" r="2.2" fill="#c8841e"/><circle cx="422" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 422,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="422" cy="324" r="2.2" fill="#c8841e"/><circle cx="438" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 438,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="438" cy="324" r="2.2" fill="#c8841e"/><circle cx="454" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 454,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="454" cy="324" r="2.2" fill="#c8841e"/><circle cx="470" cy="301" r="2.6" fill="#5a3a0e"/><path d="M 470,306 q 0,10 0,16" stroke="#c8841e" stroke-width="2.4" fill="none"/><circle cx="470" cy="324" r="2.2" fill="#c8841e"/><circle cx="34" cy="92" r="16" fill="#1F4E79"/><text x="34" y="97" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="90" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="start">Capture</text><text x="60" y="108" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">Grease-laden air is pulled</text><text x="60" y="123" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">into the hood.</text><circle cx="34" cy="165" r="16" fill="#1F4E79"/><text x="34" y="170" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="60" y="163" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="start">Change direction</text><text x="60" y="181" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">The air makes quick turns</text><text x="60" y="196" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">through the angled baffles.</text><circle cx="34" cy="238" r="16" fill="#1F4E79"/><text x="34" y="243" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="60" y="236" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="start">Separate</text><text x="60" y="254" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">The heavy grease can't follow;</text><text x="60" y="269" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">it hits the metal and sticks.</text><circle cx="34" cy="315" r="16" fill="#1F4E79"/><text x="34" y="320" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="60" y="313" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="start">Drain</text><text x="60" y="331" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">It runs down the baffles to</text><text x="60" y="346" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">the trough and container.</text><line x1="500" y1="96" x2="465" y2="70" stroke="#1c6cb0" stroke-width="2"/><circle cx="465" cy="70" r="4" fill="#1c6cb0"/><text x="506" y="92" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#2b3a4a" text-anchor="start">Cleaner air</text><text x="506" y="107" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">to the fan</text><line x1="500" y1="205" x2="470" y2="170" stroke="#c8841e" stroke-width="2"/><circle cx="470" cy="170" r="4" fill="#c8841e"/><text x="506" y="201" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#2b3a4a" text-anchor="start">Grease sticks</text><text x="506" y="216" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">to the baffles</text><line x1="500" y1="300" x2="470" y2="301" stroke="#c8841e" stroke-width="2"/><circle cx="470" cy="301" r="4" fill="#c8841e"/><text x="506" y="296" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#2b3a4a" text-anchor="start">Drain holes on</text><text x="506" y="311" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="400" fill="#2b3a4a" text-anchor="start">both rails (reversible)</text><rect x="12" y="398" width="616" height="32" rx="7" fill="#eaf1f8" stroke="#1F4E79" stroke-width="1.5"/><text x="22" y="418" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F4E79" text-anchor="start">KEY TAKEAWAY:</text><text x="140" y="418" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#2b3a4a" text-anchor="start">a change in airflow plus gravity captures, holds, and drains the grease (NFPA 96).</text></svg>